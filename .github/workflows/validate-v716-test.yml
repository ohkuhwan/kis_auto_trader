name: Validate extracted V7.1.6 source

on:
  push:
    branches:
      - archive-unpack-test
    paths:
      - "**"

permissions:
  contents: read

jobs:
  verify-and-test:
    if: github.ref == 'refs/heads/archive-unpack-test'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4
        with:
          ref: archive-unpack-test

      - name: Verify extracted files against ZIP manifest
        working-directory: source/kis_auto_trader_v7_1_6
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, sys
          root = pathlib.Path(".")
          manifest_path = pathlib.Path("../V7.1.6-EXTRACTION-MANIFEST.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          errors = []
          total = 0
          for item in manifest["files"]:
              path = root / item["path"]
              if not path.is_file():
                  errors.append(f"MISSING: {item['path']}")
                  continue
              data = path.read_bytes()
              digest = hashlib.sha256(data).hexdigest()
              if len(data) != item["size"] or digest != item["sha256"]:
                  errors.append(f"MISMATCH: {item['path']}")
              total += len(data)
          print(f"Manifest files: {len(manifest['files'])}")
          print(f"Verified bytes: {total}")
          print(f"Integrity errors: {len(errors)}")
          for error in errors:
              print(error)
          if errors:
              sys.exit(1)
          PY

      - name: Install test dependencies
        working-directory: source/kis_auto_trader_v7_1_6
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run automated tests
        working-directory: source/kis_auto_trader_v7_1_6
        env:
          KIS_PAPER: "true"
          KIS_ENABLE_TRADING: "false"
        run: |
          python3 -m pytest -q
